[project]
name = "hivtools-mcp"
version = "0.3.6"
description = "API and MCP server for hivtools data"
authors = [{ name = "Rob Ashton", email = "robertashton94@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.10,<4.0"
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "duckdb>=1.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "fastmcp>=4.0.3",
    "loguru>=0.7.3",
    "pydantic>=2",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.9",
    "tomli>=2.0 ; python_version < '3.11'",
]

[project.urls]
Homepage = "https://hivtools.github.io/hivtools-mcp/"
Repository = "https://github.com/hivtools/hivtools-mcp"
Documentation = "https://hivtools.github.io/hivtools-mcp/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "httpx2>=2.12.0",
]

[tool.uv]
package = false

[tool.deptry]
# `app` is this repo's own code; there is no installed package metadata naming it
# (see tool.uv.package) so deptry needs telling.
known_first_party = ["app"]

[tool.ty.environment]
python = "./.venv"
python-version = "3.10"

[tool.ty.src]
# data-prep/ holds standalone PEP 723 scripts run via `uv run --script`; their
# deps (polars, docopt) live in that ephemeral env, not the project venv.
exclude = ["data-prep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # Starlette's own TestClient module triggers this on import; nothing we can fix here.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120
fix = true

[tool.ruff.lint]
select = [
    # flake8-2020
    "YTT",
    # flake8-bandit
    "S",
    # flake8-bugbear
    "B",
    # flake8-builtins
    "A",
    # flake8-comprehensions
    "C4",
    # flake8-debugger
    "T10",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # mccabe
    "C90",
    # pycodestyle
    "E", "W",
    # pyflakes
    "F",
    # pygrep-hooks
    "PGH",
    # pyupgrade
    "UP",
    # ruff
    "RUF",
    # tryceratops
    "TRY",
]
ignore = [
    # LineTooLong
    "E501",
    # DoNotAssignLambda
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# S101: asserts are how pytest tests assert.
# S608: test fixtures build SQL against throwaway in-memory DuckDB tables.
"tests/*" = ["S101", "S608"]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true

[tool.coverage.run]
branch = true
source = ["app"]
