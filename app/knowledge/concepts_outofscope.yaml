# Out-of-scope layer: catches questions this dataset genuinely cannot answer,
# so the model declines with a reason and a pointer instead of guessing an
# indicator that doesn't exist or answering from general knowledge.
#
# Same schema as concepts_analysis.yaml (merges into the same field="concept"
# search index at load time - see loader.py), but every entry here has
# `answerable: false` and an empty `indicators` list: nothing to query,
# because there is nothing in the data.
#
# Schema: see concepts_analysis.yaml's header comment.


mother_to_child_transmission:
  label: Mother-to-child / vertical transmission
  aliases:
    - MTCT
    - mother to child transmission
    - vertical transmission
    - infant HIV
    - babies born with HIV
    - infant outcomes
  what_it_measures: HIV transmission from mother to child during pregnancy, birth or breastfeeding, and infant HIV outcomes.
  indicators: []
  notes: >-
    Not this: PMTCT service coverage (pregnant women receiving/needing
    prophylaxis) is answerable - see antenatal_care's pmtct_receiving/
    pmtct_need. This concept is the transmission/infant-outcome data itself
    (new child infections, babies born with HIV), which is not extracted yet
    - Spectrum's child-HIV module models it (see TODO.md, "Ask Rob G") but no
    dp.output.* function for it has been wired in.
  related: [antenatal_care]
  answerable: false

prevention_methods:
  label: Prevention methods (PEP, VMMC, condoms)
  aliases:
    - PEP
    - post-exposure prophylaxis
    - VMMC
    - voluntary medical male circumcision
    - circumcision
    - condom use
    - condom coverage
    - harm reduction
  what_it_measures: Coverage or uptake of biomedical or behavioural HIV prevention methods (excluding PrEP - see prep_coverage).
  indicators: []
  notes: >-
    Exist in Goals at the national level - to be added in next version.
  related: [key_populations, prevention_priority, prep_coverage]
  answerable: false

prep_coverage:
  label: PrEP coverage (including long-acting PrEP)
  aliases:
    - PrEP coverage
    - PrEP uptake
    - PrEP use
    - how many people are on PrEP
    - people on PrEP
    - number on PrEP
  what_it_measures: Coverage or uptake of pre-exposure prophylaxis (PrEP), including newer long-acting injectable forms such as lenacapavir and cabotegravir.
  indicators: []
  notes: >-
    No PrEP coverage data available in this dataset - exists in the Goals
    model, not in Naomi/Spectrum/SHIPP, to be added in a future version.
    This concept is only about how many people are *already* on PrEP. A
    question about who PrEP *should* go to is answerable - send it to
    prep_targeting, which ranks populations by targeting efficiency from
    SHIPP incidence and infections.
  related: [prep_targeting, key_populations, prevention_priority, prevention_methods]
  answerable: false

tb_hiv_coinfection:
  label: TB/HIV coinfection
  aliases:
    - TB
    - tuberculosis
    - TB/HIV coinfection
    - TB and HIV
  what_it_measures: Tuberculosis burden or treatment among people living with HIV.
  indicators: []
  notes: >-
    Out of scope of HIV Tools models.
    Point to: https://www.unaids.org/en/topic/tuberculosis
  answerable: false

funding_cost:
  label: Funding, budget, cost-effectiveness
  aliases:
    - funding
    - budget
    - cost per patient
    - cost-effectiveness
    - programme cost
    - financing
  what_it_measures: Money spent on the HIV response, or the cost-effectiveness of programmes.
  indicators: []
  notes: >-
    Exist in Goals at the national level - to be added in next version.
  answerable: false

stigma_discrimination:
  label: Stigma, discrimination, legal and policy environment
  aliases:
    - stigma
    - discrimination
    - human rights
    - legal environment
    - criminalisation
    - policy environment
  what_it_measures: Social, legal or policy conditions affecting people living with or at risk of HIV.
  indicators: []
  notes: >-
    Out of scope of HIV Tools models.
    Point to: https://indicatorregistry.unaids.org/indicator/stigma-and-discrimination-experienced-people-living-hiv-community-settings
  answerable: false

future_projections:
  label: Future projections (beyond the latest real-data year)
  aliases:
    - future projections
    - future estimates
    - projection
    - projections
    - forecast
    - future
    - what will happen
    - where is the epidemic headed
    - future trend
    - 2026 estimates
    - 2030 projection
  what_it_measures: Modelled estimates for years after the most recent year with real programme data behind them.
  indicators: []
  notes: >-
    This dataset serves HIV estimates informed by the most recent programme
    data available, through 2025Q4 (data-prep/LATEST_DATA_YEAR - bump this
    note alongside it each release). Naomi, Spectrum and SHIPP all project
    further ahead internally, but those projected years are dropped before
    the data reaches this server - there is no row to query for 2026 or
    later. Say plainly that projections beyond the latest real-data year are
    out of scope here, not just that the requested year has no data.
  related: [epidemic_trend, aids_mortality]
  answerable: false
