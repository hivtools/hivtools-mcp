# Concept layer: maps plain-language analysis questions to indicators.
#
# One of three concept files, all loaded by app/knowledge/loader.py:
#   concepts_analysis.yaml     this file - question -> indicators to query
#   concepts_outofscope.yaml   question -> decline + pointer, nothing to query
#   concepts_methodology.yaml  question about how the models work, not their output
#
# Hand-authored. Field names follow the UNAIDS Indicator Registry
# (https://indicatorregistry.unaids.org) so entries can later be backed by, or
# reconciled against, the official definitions.
#
# Each entry is loaded into the search index with field="concept". `aliases` are
# what the fuzzy matcher scores against; `indicators` is what the model should
# query next. Every indicator id here must exist in the dataset - tests assert it.
#
# Schema:
#   aliases                 list[str]  alternate phrasings users actually type
#   what_it_measures        str        one-line definition
#   indicators              list       {id, role, source?, note?} - role: primary | secondary | denominator;
#                                      source: which model to query it from, when it matters
#   default_disaggregation  map        sensible defaults when the user didn't say, including the
#                                      source - the same indicator can come from several models
#   cascade_stage           str?       position in the UNAIDS 95-95-95 cascade
#   notes                   str        traps, caveats, why indicators disagree
#   related                 list[str]? other concept ids
#   answerable              bool       false => the server cannot answer this at all
#   plot                    str?       "type, what it shows" - a short default suggestion, not a
#                                      spec: one line, no axes/colors/titles. The model should
#                                      still override it when the question calls for something
#                                      else. Only names chart types and data this server can
#                                      actually back - never a map (no boundary/geojson data
#                                      is exposed by this API).
#

reporting_instruction: >-
  Always answer a question that matches this concept with a short,
  high-level bullet-point summary of the headline figures plus 1-3 simple,
  static inline charts - a single-panel artifact is the right tool for this
  and is preferred, rendered directly, not generated as an image file to
  hand over as a download. Do not write extended prose. Do not build a
  multi-panel dashboard or add interactivity (filters, tooltips, toggles)
  unless the user explicitly asks for one.

treatment_gap:
  label: Treatment gap
  aliases:
    - treatment gap
    - gap in treatment
    - gaps in treatment
    - treatment gaps
    - unmet treatment need
    - unmet needs
    - untreated
    - not on treatment
    - not on ART
    - people who need treatment
    - people who need ART
    - ART gap
    - proportion not on ART
    - proportion not on treatment
  what_it_measures: People living with HIV who are not currently receiving antiretroviral therapy.
  plot: bar, top districts by untreated PLHIV count or by ART coverage
  cascade_stage: second 95 (of those diagnosed, 95% on treatment)
  indicators:
    - id: untreated_plhiv_num
      role: primary
      note: Count of resident PLHIV not on ART. Use this for "where is the biggest gap".
    - id: art_coverage
      role: secondary
      note: Proportion of PLHIV on ART. LOWER means a BIGGER gap - do not rank descending.
    - id: plhiv
      role: denominator
  default_disaggregation:
    source: naomi
    age_group: Y015_999
    sex: both
  notes: >-
    Count and coverage rank districts differently, and both are legitimate -
    report both, or ask which the user wants. Use untreated_plhiv_num
    (residents), not untreated_plhiv_attend (catchment, can be negative).
  related: [treatment_coverage, treatment_cascade, treatment_priority]

hiv_burden:
  label: HIV burden
  aliases:
    - HIV burden
    - burden of HIV
    - AIDS burden
    - disease burden
    - burden
    - most affected
    - worst affected
    - hardest hit
    - biggest HIV problem
    - highest number of PLHIV
    - most PLHIV
    - highest concentration of PLHIV
  what_it_measures: How much HIV there is in a population - either as a count of people or as a rate.
  plot: bar, top districts by PLHIV or prevalence
  indicators:
    - id: plhiv
      role: primary
      note: Number of people living with HIV. This is what "burden" usually means.
    - id: prevalence
      role: secondary
      note: Proportion of the population living with HIV. A rate, not a count.
  default_disaggregation:
    source: naomi
    age_group: Y015_049
    sex: both
  notes: >-
    Ambiguous - resolve before answering. Count and rate can disagree: a small
    district may have high prevalence but few PLHIV, a large one the reverse.
    Report both or ask which the user means. "Highest burden" usually means plhiv.
  related: [epidemic_size, age_sex_burden, key_populations]

prevention_priority:
  label: Prevention prioritisation
  aliases:
    - prevention priority
    - prioritise prevention
    - prioritize prevention
    - where to focus prevention
    - prevention services
    - where to target prevention
    - which districts for prevention
    - new infections
    - where are people getting infected
    - who is at the highest risk for HIV
    - where are people at the highest risk for HIV
  what_it_measures: Where new HIV infections are occurring, and where the per-person risk of acquiring HIV is highest.
  plot: scatter, incidence vs prevalence by district
  indicators:
    - id: incidence
      role: primary
      note: New infections per person-year. The per-person RISK - use for "highest risk".
    - id: infections
      role: secondary
      note: Absolute number of new infections per year. Use for "where are the most infections".
    - id: prevalence
      role: secondary
      note: Existing burden, not new risk - paired with incidence on the scatter below.
  default_disaggregation:
    source: naomi
    age_group: Y015_049
    sex: both
  notes: >-
    Incidence (rate) and infections (count) rank districts differently - rate
    shows highest individual risk, count shows most infections averted. Programme
    prioritisation usually wants both. Incidence is per person-year: 0.0018 =
    1.8 per 1,000 a year. Incidence against prevalence is a third view: a
    district with high incidence but comparatively low prevalence has a
    fast-growing or early-stage epidemic there - worth flagging even if its
    absolute burden (hiv_burden) is not yet the largest. For sex workers, MSM
    or PWID, see key_populations.
  related: [acquisition_risk, hiv_burden, key_populations]

treatment_priority:
  label: Treatment prioritisation
  aliases:
    - treatment priority
    - prioritise treatment
    - prioritize treatment
    - where to expand treatment
    - increase treatment coverage
    - scale up ART
    - scale of treatment coverage
    - ART priority
  what_it_measures: Where increasing ART coverage would reach the most untreated people living with HIV.
  plot: scatter, prevalence vs ART coverage by district
  cascade_stage: second 95
  indicators:
    - id: untreated_plhiv_num
      role: primary
      note: Untreated PLHIV - the size of the opportunity.
    - id: art_coverage
      role: primary
      note: Current coverage - low coverage means the most headroom.
    - id: prevalence
      role: secondary
  default_disaggregation:
    source: naomi
    age_group: Y015_999
    sex: both
  notes: >-
    Usually means high prevalence AND low ART coverage together - report the
    combination, not a single ranking. Districts scoring badly on both are the
    clearest priorities; note where the two disagree.
  related: [treatment_gap, treatment_coverage]

treatment_coverage:
  label: ART treatment coverage
  aliases:
    - treatment coverage
    - ART coverage
    - on treatment
    - receiving treatment
    - antiretroviral coverage
    - proportion on ART
    - how many on ART
  what_it_measures: The proportion of people living with HIV who are receiving antiretroviral therapy.
  plot: bar, districts ranked by ART coverage
  cascade_stage: second 95
  indicators:
    - id: art_coverage
      role: primary
      note: Proportion 0-1. 0.84 means 84%.
    - id: art_current_residents
      role: secondary
      note: Number on ART who live in the area. Use this for resident counts.
    - id: art_current
      role: secondary
      note: Number receiving ART at facilities in the area (catchment/service load).
  default_disaggregation:
    source: naomi
    age_group: Y015_999
    sex: both
  notes: >-
    art_current_residents and art_current differ at district level - patients
    cross boundaries for care. Use residents for population questions,
    attending for workload questions.
  related: [treatment_gap, treatment_cascade]

awareness_of_status:
  label: Awareness of HIV status
  aliases:
    - know their status
    - aware of status
    - knowledge of status
    - diagnosed
    - undiagnosed
    - unaware
    - first 95
    - testing gap
    - who knows they have HIV
    - KOS
  what_it_measures: The proportion of people living with HIV who know they are HIV positive.
  plot: bar, districts ranked by awareness proportion
  cascade_stage: first 95 (95% of PLHIV know their status)
  indicators:
    - id: aware_plhiv_prop
      role: primary
      note: Proportion of PLHIV aware of their status, 0-1.
    - id: aware_plhiv_num
      role: secondary
    - id: unaware_plhiv_num
      role: secondary
      note: Count who do not know. Use for "testing gap" framed as a number.
  default_disaggregation:
    source: naomi
    age_group: Y015_999
    sex: both
  notes: >-
    First 95. Use the _num (residents) forms, not _attend (catchment, can be
    negative).
  related: [treatment_cascade, treatment_gap]

treatment_cascade:
  label: HIV treatment cascade (95-95-95)
  aliases:
    - treatment cascade
    - care cascade
    - HIV cascade
    - 95-95-95
    - 95 95 95
    - three 95s
    - UNAIDS targets
    - cascade of care
    - progress across cascade
    - 95 95 95 progress
    - 95-95-95 progress
  what_it_measures: Progress through the UNAIDS 95-95-95 targets - diagnosed, on treatment, virally suppressed.
  plot: bar, the three 95 stages side by side as a cascade/funnel
  indicators:
    - id: aware_plhiv_prop
      role: primary
      note: First 95 - proportion of PLHIV who know their status.
    - id: art_coverage
      role: primary
      note: Second 95 - proportion of PLHIV on ART.
    - id: vls_suppression_prop
      role: primary
      source: spectrum
      note: >-
        Third-95 proxy - proportion of those with a viral load test result
        who are suppressed, not proportion of all PLHIV suppressed.
    - id: plhiv
      role: denominator
  default_disaggregation:
    source: naomi
    age_group: Y015_999
    sex: both
  notes: >-
    All three 95s exist, but not at the same disaggregation: aware_plhiv_prop
    and art_coverage default to Naomi (subnational), vls_suppression_prop is
    Spectrum, national only - report the third stage nationally even when the
    first two are subnational, and say so rather than presenting all three as
    one consistent geography. vls_suppression_prop's denominator is people
    tested, not all PLHIV, so it is a proxy for the strict third-95 definition
    (proportion of PLHIV suppressed), not an exact match - flag that if
    precision matters. UNAIDS reports the cascade two ways: each stage over
    total PLHIV, or each stage over the previous stage's numerator - state
    which. Here art_coverage is over all PLHIV, not just those diagnosed.
  related: [awareness_of_status, treatment_coverage, treatment_gap]

acquisition_risk:
  label: Risk of acquiring HIV
  aliases:
    - risk of acquiring HIV
    - highest risk
    - who is most at risk
    - most at risk
    - vulnerable populations
  what_it_measures: Which age and sex groups face the highest per-person risk of acquiring HIV.
  plot: grouped bar, incidence by age group split by sex
  indicators:
    - id: incidence
      role: primary
      note: Rate per person-year. Disaggregate by age_group and sex.
    - id: infections
      role: secondary
  default_disaggregation:
    source: naomi
    sex: [male, female]
    age_group: five_year_bands
  notes: >-
    For age/sex risk, request sex=male and sex=female separately - sex=both
    hides the male/female gap that's the point of the question. Naomi has no
    key-population breakdown (sex workers, MSM, PWID); use key_populations
    where SHIPP exists.
  related: [prevention_priority, age_sex_burden, key_populations]

age_sex_burden:
  label: HIV burden by age and sex
  aliases:
    - burden by age
    - which age groups
    - age distribution
    - age and sex breakdown
    - who is affected
    - which populations
    - demographic breakdown
  what_it_measures: How people living with HIV are distributed across age groups and sexes.
  plot: grouped bar (or population pyramid), PLHIV by age group split by sex
  indicators:
    - id: plhiv
      role: primary
    - id: prevalence
      role: secondary
      note: Rate within each age group - peaks at different ages than the count.
    - id: population
      role: denominator
  default_disaggregation:
    source: naomi
    sex: [male, female]
    age_group: five_year_bands
  notes: >-
    Use the 17 five-year bands and sex=male/female separately. Never sum all 33
    age groups - they overlap and inflate the total. plhiv peaks in middle age
    by count; prevalence peaks later - say which is being shown.
  related: [hiv_burden, acquisition_risk]

epidemic_size:
  label: Epidemic size
  aliases:
    - how many people have HIV
    - number living with HIV
    - PLHIV
    - people living with HIV
    - total infected
    - epidemic size
  what_it_measures: The number of people living with HIV.
  plot: bar, top districts by PLHIV
  indicators:
    - id: plhiv
      role: primary
    - id: population
      role: denominator
  default_disaggregation:
    source: naomi
    age_group: Y000_999
    sex: both
  notes: >-
    Use area_level=0 for a national total - never sum districts and levels
    together. Naomi gives the recent subnational picture; for the number over
    many years use source=spectrum (see epidemic_trend). Never report a value
    as the sum of naomi's and spectrum's rows - pick one. That is a rule about
    reporting, not a claim that the two are unrelated: Naomi takes several of
    its own inputs directly from Spectrum (population, fertility, survival,
    incidence rate ratios, awareness-of-status) and its district estimates may
    optionally be calibrated to align with Spectrum's national totals - see
    the naomi_vs_spectrum methodology entry. If asked how they relate, say
    that, rather than describing them as two independent estimates.
  related: [hiv_burden, epidemic_trend]

antenatal_care:
  label: Antenatal care (ANC)
  aliases:
    - ANC
    - antenatal
    - pregnant women
    - PMTCT
    - mother to child
    - maternal HIV
  what_it_measures: HIV indicators among women attending their first antenatal care visit, and national PMTCT service coverage.
  plot: bar, districts ranked by ANC prevalence or ANC ART coverage
  indicators:
    - id: anc_prevalence
      role: primary
    - id: anc_art_coverage
      role: primary
    - id: anc_clients
      role: denominator
    - id: anc_plhiv
      role: secondary
    - id: pmtct_receiving
      role: secondary
      source: spectrum
      note: National total, not an ANC-attendee count - pregnant women receiving PMTCT prophylaxis or treatment.
    - id: pmtct_need
      role: secondary
      source: spectrum
      note: National total, not an ANC-attendee count - pregnant women in need of PMTCT.
  default_disaggregation:
    source: naomi
    sex: female
  notes: >-
    Female-only, 12 age groups not 33. Measures ANC attendees, not the general
    female population - don't present anc_prevalence as female prevalence.
    `pmtct_receiving`/`pmtct_need` are a different basis from the anc_*
    indicators - Spectrum national totals against all pregnant women, not
    Naomi ANC-attendee counts - so don't combine them in one figure; PMTCT
    coverage as a proportion (pmtct_receiving/pmtct_need) can be derived from
    them if asked. No vertical-transmission or infant-outcome indicator -
    that is genuinely out of scope, see mother_to_child_transmission.

epidemic_trend:
  label: Change in the epidemic over time
  aliases:
    - trend
    - over time
    - has it changed
    - change over the years
    - past 10 years
    - past 20 years
    - historical
    - time series
    - epidemic trajectory
    - how has the epidemic changed
  what_it_measures: How the epidemic has changed over time, nationally.
  plot: line, key indicators (rates) over time
  indicators:
    - id: plhiv
      role: primary
      source: spectrum
      note: People living with HIV at each year's end.
    - id: infections
      role: primary
      source: spectrum
      note: New infections during each year.
    - id: aids_deaths
      role: primary
      source: spectrum
      note: AIDS deaths during each year.
    - id: art_current
      role: secondary
      source: spectrum
      note: Number on ART.
    - id: population
      role: denominator
      source: spectrum
  default_disaggregation:
    source: spectrum
    area_level: 0
    age_group: Y000_999
    sex: both
  notes: >-
    Long-term change is Spectrum only (source=spectrum), never Naomi - Naomi's
    few recent quarters cannot support a 5-, 10- or 20-year trend. Default to
    rates, not counts, when the user hasn't said which: prevalence
    (plhiv/population), ART coverage (art_current/plhiv), incidence
    (infections/population) and the AIDS-mortality rate (aids_deaths/
    population) - a rate says whether the epidemic is getting better or worse
    per person, which a rising count alone does not (plhiv can rise for years
    purely because ART keeps more people alive, even as risk falls). Show
    counts instead only when the user specifically wants absolute numbers
    (e.g. "how many people" rather than "how has it changed"). None of the
    four rates are native to Spectrum - actually fetch plhiv, population,
    art_current, infections and aids_deaths and compute each rate per period;
    do not just describe that deriving it is possible without doing the
    arithmetic. Do this silently: state the rate as a fact, don't narrate
    the fetch-and-divide steps or caveat every figure with how it was
    calculated - that belongs in a footnote at most, and only in full if the
    user asks how a number was worked out or questions a figure. Also disaggregated by age and sex - see
    age_sex_burden for burden-by-age-over-time.
  related: [epidemic_size, aids_mortality, hiv_burden, age_sex_burden]

aids_mortality:
  label: AIDS deaths
  aliases:
    - AIDS deaths
    - AIDS mortality
    - HIV mortality
    - dying of AIDS
    - died of AIDS
    - how many people die
    - death toll
  what_it_measures: The number of people who die of AIDS-related causes each year.
  indicators:
    - id: aids_deaths
      role: primary
      source: spectrum
      note: Deaths during the year, national.
    - id: plhiv
      role: denominator
      source: spectrum
  default_disaggregation:
    source: spectrum
    area_level: 0
    age_group: Y000_999
    sex: both
  notes: >-
    National only, from Spectrum - check coverage. Naomi has no deaths estimate,
    so there's no subnational figure; say so if asked. A count for the calendar
    year, not a rate.
  related: [epidemic_trend, epidemic_size, general_mortality]

general_mortality:
  label: Non-AIDS deaths
  aliases:
    - non-AIDS deaths
    - other-cause mortality
    - deaths not from AIDS
    - general mortality
    - all-cause mortality
    - overall death rate
  what_it_measures: The number of people who die of causes other than AIDS each year.
  indicators:
    - id: non_aids_deaths
      role: primary
      source: spectrum
      note: Deaths from causes other than AIDS during the year, national.
    - id: population
      role: denominator
      source: spectrum
  default_disaggregation:
    source: spectrum
    area_level: 0
    age_group: Y000_999
    sex: both
  notes: >-
    National only, from Spectrum - check coverage. Naomi has no deaths
    estimate, so there's no subnational figure; say so if asked. A count for
    the calendar year, not a rate. No life-expectancy indicator - only a
    death count, don't present it as one. All-cause mortality can be derived
    by adding aids_deaths (see aids_mortality) to non_aids_deaths - state
    that it's a derived sum if asked for "all deaths" or "total mortality".
  related: [aids_mortality, epidemic_trend]

viral_suppression:
  label: Viral suppression / viral load
  aliases:
    - viral suppression
    - viral load
    - undetectable
    - virally suppressed
    - third 95
    - suppressed viral load
  what_it_measures: The proportion of people tested whose HIV viral load is suppressed below a detectable threshold.
  indicators:
    - id: vls_suppression_prop
      role: primary
      source: spectrum
      note: Proportion of those with a viral load test result who are suppressed.
  default_disaggregation:
    source: spectrum
    area_level: 0
    sex: both
  notes: >-
    National only, from Spectrum, and only an input where a survey/programme
    figure was entered for that year - many years and some countries will
    have none; check coverage before assuming it exists. Reported by
    population group, not the usual age groups: children 0-14 (sex both),
    males 15+, females 15+ - no finer age breakdown exists. The denominator
    is people tested, not all PLHIV, so this is a proxy for the strict UNAIDS
    third-95 definition (proportion of PLHIV suppressed), not an exact match -
    see treatment_cascade.
  related: [treatment_cascade, aids_mortality]

key_populations:
  label: Key and priority populations
  aliases:
    - key populations
    - key population
    - priority populations
    - risk groups
    - behavioural risk groups
    - high risk groups
    - sexual behaviour
    - sexual risk
    - population size estimates
    - size estimates
    - SHIPP
  what_it_measures: >-
    Population size, people living with HIV and new infections among adults
    split by sexual behaviour, including female sex workers, men who have sex
    with men and people who inject drugs.
  indicators:
    - id: population
      role: primary
      source: shipp
      note: Size of each risk group.
    - id: incidence
      role: primary
      source: shipp
      note: Per-person risk in each group - use for "who is most at risk".
    - id: infections
      role: secondary
      source: shipp
      note: New infections per year in each group - use for "where do most infections occur".
    - id: plhiv
      role: secondary
      source: shipp
    - id: prevalence
      role: secondary
      source: shipp
  default_disaggregation:
    source: shipp
    age_group: Y015_049
    sex: [female, male]
  notes: >-
    Only for countries with SHIPP estimates (source=shipp) - Naomi and Spectrum
    have no risk-group breakdown. SHIPP is adults 15-49, one quarter, often
    older than Naomi's - totals won't match and must not be combined. Groups
    differ by sex: sexpaid12m (sex workers) is women only; male_key_pop (men
    who have sex with men and men who inject drugs, combined into one group)
    is men only; the rest exist for both. Within one sex, groups are mutually
    exclusive and sum to the whole population; under sex=both, single-sex
    groups carry that sex's figures. Omit risk_group for every group. Sizes
    are modelled, not counted, with no uncertainty intervals. A small group
    can have high incidence but few infections - report both.
  related: [acquisition_risk, prevention_priority]
