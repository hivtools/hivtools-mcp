# Concept layer: maps plain-language phrases to indicators.
#
# Hand-authored. Field names follow the UNAIDS Indicator Registry
# (https://indicatorregistry.unaids.org) so entries can later be backed by, or
# reconciled against, the official definitions.
#
# Each entry is loaded into the search index with field="concept". `aliases` are
# what the fuzzy matcher scores against; `indicators` is what the model should
# query next. Every indicator id here must exist in the dataset - tests assert it.
#
# Schema:
#   aliases                 list[str]  alternate phrasings users actually type
#   what_it_measures        str        one-line definition
#   indicators              list       {id, role, note?} - role: primary | secondary | denominator
#   default_disaggregation  map        sensible defaults when the user didn't say
#   cascade_stage           str?       position in the UNAIDS 95-95-95 cascade
#   notes                   str        traps, caveats, why indicators disagree
#   related                 list[str]? other concept ids
#   answerable              bool       false => the server cannot answer this at all

treatment_gap:
  label: Treatment gap
  aliases:
    - treatment gap
    - gap in treatment
    - gaps in treatment
    - treatment gaps
    - unmet treatment need
    - untreated
    - not on treatment
    - not on ART
    - people who need treatment
    - ART gap
  what_it_measures: People living with HIV who are not currently receiving antiretroviral therapy.
  cascade_stage: second 95 (of those diagnosed, 95% on treatment)
  indicators:
    - id: untreated_plhiv_num
      role: primary
      note: Count of resident PLHIV not on ART. Use this for "where is the biggest gap".
    - id: art_coverage
      role: secondary
      note: Proportion of PLHIV on ART. LOWER means a BIGGER gap - do not rank descending.
    - id: plhiv
      role: denominator
  default_disaggregation:
    age_group: Y015_999
    sex: both
  notes: >-
    The count form and the coverage form rank districts differently and both are
    legitimate: a large district can have the biggest absolute gap while having
    above-average coverage. Report both, or ask which the user wants. Use the
    residents form (untreated_plhiv_num), not untreated_plhiv_attend, which is a
    catchment measure and can be negative.
  related: [treatment_coverage, treatment_cascade, treatment_priority]

hiv_burden:
  label: HIV burden
  aliases:
    - HIV burden
    - burden of HIV
    - AIDS burden
    - disease burden
    - burden
    - most affected
    - worst affected
    - hardest hit
    - biggest HIV problem
  what_it_measures: How much HIV there is in a population - either as a count of people or as a rate.
  indicators:
    - id: plhiv
      role: primary
      note: Number of people living with HIV. This is what "burden" usually means.
    - id: prevalence
      role: secondary
      note: Proportion of the population living with HIV. A rate, not a count.
  default_disaggregation:
    age_group: Y015_049
    sex: both
  notes: >-
    Ambiguous term - resolve it before answering. Count and rate give different
    answers: a small district can have high prevalence but few PLHIV, and a large
    urban district the reverse. If the user has not said which they mean, either
    report both or ask. "Highest burden" most often means plhiv.
  related: [epidemic_size, prevalence_concept, age_sex_burden]

prevention_priority:
  label: Prevention prioritisation
  aliases:
    - prevention priority
    - prioritise prevention
    - prioritize prevention
    - where to focus prevention
    - prevention services
    - where to target prevention
    - which districts for prevention
    - new infections
    - where are people getting infected
  what_it_measures: Where new HIV infections are occurring, and where the per-person risk of acquiring HIV is highest.
  indicators:
    - id: incidence
      role: primary
      note: New infections per person-year. The per-person RISK - use for "highest risk".
    - id: infections
      role: secondary
      note: Absolute number of new infections per year. Use for "where are the most infections".
  default_disaggregation:
    age_group: Y015_049
    sex: both
  notes: >-
    "Prioritise prevention" translates to highest incidence (rate) or most
    infections (count); these rank differently. Rate targets where individuals
    are most at risk; count targets where the most infections could be averted.
    Programme prioritisation usually wants both. Incidence is a
    rate_per_person_year - 0.0018 is 1.8 per 1,000 per year.
  related: [acquisition_risk, hiv_burden]

treatment_priority:
  label: Treatment prioritisation
  aliases:
    - treatment priority
    - prioritise treatment
    - prioritize treatment
    - where to expand treatment
    - increase treatment coverage
    - scale up ART
    - ART priority
  what_it_measures: Where increasing ART coverage would reach the most untreated people living with HIV.
  cascade_stage: second 95
  indicators:
    - id: untreated_plhiv_num
      role: primary
      note: Untreated PLHIV - the size of the opportunity.
    - id: art_coverage
      role: primary
      note: Current coverage - low coverage means the most headroom.
    - id: prevalence
      role: secondary
  default_disaggregation:
    age_group: Y015_999
    sex: both
  notes: >-
    Usually means "high prevalence AND low ART coverage" - a two-indicator
    question. Districts scoring badly on both are the clearest priorities; report
    the combination rather than a single ranking, and note where they disagree.
  related: [treatment_gap, treatment_coverage]

treatment_coverage:
  label: ART treatment coverage
  aliases:
    - treatment coverage
    - ART coverage
    - on treatment
    - receiving treatment
    - antiretroviral coverage
    - proportion on ART
    - how many on ART
  what_it_measures: The proportion of people living with HIV who are receiving antiretroviral therapy.
  cascade_stage: second 95
  indicators:
    - id: art_coverage
      role: primary
      note: Proportion 0-1. 0.84 means 84%.
    - id: art_current_residents
      role: secondary
      note: Number on ART who live in the area. Use this for resident counts.
    - id: art_current
      role: secondary
      note: Number receiving ART at facilities in the area (catchment/service load).
  default_disaggregation:
    age_group: Y015_999
    sex: both
  notes: >-
    art_current_residents and art_current differ substantially at district
    level because patients cross boundaries for care. Use residents for
    population questions, attending for facility workload questions.
  related: [treatment_gap, treatment_cascade]

awareness_of_status:
  label: Awareness of HIV status
  aliases:
    - know their status
    - aware of status
    - knowledge of status
    - diagnosed
    - undiagnosed
    - unaware
    - first 95
    - testing gap
    - who knows they have HIV
  what_it_measures: The proportion of people living with HIV who know they are HIV positive.
  cascade_stage: first 95 (95% of PLHIV know their status)
  indicators:
    - id: aware_plhiv_prop
      role: primary
      note: Proportion of PLHIV aware of their status, 0-1.
    - id: aware_plhiv_num
      role: secondary
    - id: unaware_plhiv_num
      role: secondary
      note: Count who do not know. Use for "testing gap" framed as a number.
  default_disaggregation:
    age_group: Y015_999
    sex: both
  notes: >-
    This is the first 95. Use the _num (residents) forms rather than _attend,
    which are catchment measures and can be negative.
  related: [treatment_cascade, treatment_gap]

treatment_cascade:
  label: HIV treatment cascade (95-95-95)
  aliases:
    - treatment cascade
    - care cascade
    - HIV cascade
    - 95-95-95
    - 95 95 95
    - three 95s
    - UNAIDS targets
    - cascade of care
  what_it_measures: Progress through the UNAIDS 95-95-95 targets - diagnosed, on treatment, virally suppressed.
  indicators:
    - id: aware_plhiv_prop
      role: primary
      note: First 95 - proportion of PLHIV who know their status.
    - id: art_coverage
      role: primary
      note: Second 95 - proportion of PLHIV on ART.
    - id: plhiv
      role: denominator
  default_disaggregation:
    age_group: Y015_999
    sex: both
  notes: >-
    Only the first two 95s are available - this dataset has NO viral suppression
    indicator, so the third 95 cannot be reported. Say so rather than omitting it
    silently. Note also that UNAIDS publishes the cascade two ways: with a common
    PLHIV denominator for all three stages, or with each stage denominated by the
    previous stage's numerator. State which you are using. art_coverage here is
    denominated by all PLHIV, not by those diagnosed.
  related: [awareness_of_status, treatment_coverage, treatment_gap]

acquisition_risk:
  label: Risk of acquiring HIV
  aliases:
    - risk of acquiring HIV
    - highest risk
    - who is most at risk
    - most at risk
    - risk groups
    - vulnerable populations
    - key populations
  what_it_measures: Which age and sex groups face the highest per-person risk of acquiring HIV.
  indicators:
    - id: incidence
      role: primary
      note: Rate per person-year. Disaggregate by age_group and sex.
    - id: infections
      role: secondary
  default_disaggregation:
    sex: [male, female]
    age_group: five_year_bands
  notes: >-
    For age/sex risk questions, request sex=male and sex=female separately -
    sex=both hides the large male/female difference that is the point of the
    question. This dataset has no key-population (sex worker, MSM, PWID)
    disaggregation; if asked about key populations, say so.
  related: [prevention_priority, age_sex_burden]

age_sex_burden:
  label: HIV burden by age and sex
  aliases:
    - burden by age
    - which age groups
    - age distribution
    - age and sex breakdown
    - who is affected
    - which populations
    - demographic breakdown
  what_it_measures: How people living with HIV are distributed across age groups and sexes.
  indicators:
    - id: plhiv
      role: primary
    - id: prevalence
      role: secondary
      note: Rate within each age group - peaks at different ages than the count.
    - id: population
      role: denominator
  default_disaggregation:
    sex: [male, female]
    age_group: five_year_bands
  notes: >-
    Request a valid age partition (the 17 five-year bands) and sex=male/female
    separately. Never sum all 33 age groups - they overlap and the total comes
    out several times too high. plhiv peaks in middle age groups by count while
    prevalence peaks later; say which you are showing.
  related: [hiv_burden, acquisition_risk]

epidemic_size:
  label: Epidemic size
  aliases:
    - how many people have HIV
    - number living with HIV
    - PLHIV
    - people living with HIV
    - total infected
    - epidemic size
  what_it_measures: The number of people living with HIV.
  indicators:
    - id: plhiv
      role: primary
    - id: population
      role: denominator
  default_disaggregation:
    age_group: Y000_999
    sex: both
  notes: For a national total use area_level=0; do not sum districts and levels together.
  related: [hiv_burden]

antenatal_care:
  label: Antenatal care (ANC)
  aliases:
    - ANC
    - antenatal
    - pregnant women
    - PMTCT
    - mother to child
    - maternal HIV
  what_it_measures: HIV indicators among women attending their first antenatal care visit.
  indicators:
    - id: anc_prevalence
      role: primary
    - id: anc_art_coverage
      role: primary
    - id: anc_clients
      role: denominator
    - id: anc_plhiv
      role: secondary
  default_disaggregation:
    sex: female
  notes: >-
    ANC indicators are female-only and use 12 age groups rather than 33. They
    measure ANC attendees, who are not representative of the general female
    population - do not present anc_prevalence as female prevalence. This dataset
    has no vertical-transmission or infant-outcome indicator.

epidemic_trend:
  label: Change in the epidemic over time
  aliases:
    - trend
    - over time
    - has it changed
    - change over the years
    - past 10 years
    - past 20 years
    - historical
    - time series
    - epidemic trajectory
    - how has the epidemic changed
  what_it_measures: How the epidemic has changed over time.
  answerable: false
  indicators: []
  notes: >-
    NOT ANSWERABLE beyond a very short window. Naomi estimates only a handful
    of quarters spanning a few years, and not every indicator covers all of
    them. Do not fit a trend to those points and describe it as a 5-, 10- or
    20-year change. Resolve the actual coverage, tell the user the span the data
    covers, offer the earliest-to-latest comparison if that is useful, and say
    that longer trends require Spectrum/PJNZ national estimates, which this
    server does not yet serve.
  related: [hiv_burden, prevalence_concept]
