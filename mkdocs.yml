site_name: hivtools-mcp
repo_url: https://github.com/hivtools/hivtools-mcp
site_url: https://hivtools.github.io/hivtools-mcp
site_description: API and MCP server for hivtools data
site_author: Rob Ashton
edit_uri: edit/main/docs/
repo_name: hivtools/hivtools-mcp
copyright: Maintained by Rob Ashton.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["."]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hivtools/hivtools-mcp

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
