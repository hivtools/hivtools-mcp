name: release-main

on:
  release:
    types: [published]

jobs:

  deploy-docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Build documentation
        run: uv run mkdocs build --clean

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-azure:
    permissions:
      contents: read
      id-token: write   # Azure OIDC login
    environment:
      name: production
      url: https://${{ vars.CONTAINER_APP_FQDN }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-azure-production
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up the environment
        uses: ./.github/actions/setup-python-env

      - name: Verify pyproject version matches the release tag
        run: |
          version=$(uv run python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "v$version" != "${{ github.event.release.tag_name }}" ]; then
            echo "::error::pyproject version v$version does not match release tag ${{ github.event.release.tag_name }} - bump pyproject.toml"
            exit 1
          fi

      # The private inputs, from a separate private repo. This repo is public, and
      # so are its Actions logs: nothing below may print the data. The deploy key
      # and repo name live in the production environment, which only release
      # runs can reach.
      - name: Check out private data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ref: ${{ vars.DATA_REPO_REF }}
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          path: data-prep/private-data
          persist-credentials: false

      - name: Record the data version
        run: echo "Building with ${{ vars.DATA_REPO }} at $(git -C data-prep/private-data rev-parse HEAD)"

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Only public packages are cached, never data.
      - name: Cache R packages
        uses: actions/cache@v6
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ runner.os }}-${{ hashFiles('Makefile') }}

      - name: Install R packages
        run: make r-deps

      # Output is discarded rather than shown: it names the private files and
      # summarises their contents. Reproduce a failure locally with `make data`.
      - name: Build the dataset
        run: |
          if ! make data > /dev/null 2>&1; then
            echo "::error::Building the dataset failed. Check out the data repo into data-prep/private-data and run 'make data' locally to see why."
            exit 1
          fi

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name ${{ vars.ACR_NAME }}

      # The dataset goes in as a named context, replacing the Dockerfile's demo
      # data stage. No build cache: its layers would hold the data, and a GitHub
      # Actions cache can be read by other workflows in this public repo.
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: data=data-prep/naomi-data
          no-cache: true
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/hivtools-mcp:${{ github.event.release.tag_name }}
            ${{ vars.ACR_LOGIN_SERVER }}/hivtools-mcp:latest

      - name: Roll a new Container Apps revision
        uses: azure/container-apps-deploy-action@v2
        with:
          containerAppName: ${{ vars.CONTAINER_APP_NAME }}
          resourceGroup: ${{ vars.RESOURCE_GROUP }}
          imageToDeploy: ${{ vars.ACR_LOGIN_SERVER }}/hivtools-mcp:${{ github.event.release.tag_name }}

      # Data responses are only ever piped to grep: the log is public. /version is
      # printed, as it holds nothing but the name and version.
      - name: Smoke test
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          FQDN: ${{ vars.CONTAINER_APP_FQDN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          VERSION=${VERSION#v}

          # Runs the rest of the arguments up to $1 times, waiting 5s, 10s, 20s,
          # then 30s between tries.
          retry() {
            local attempts=$1 delay=5 attempt
            shift
            for attempt in $(seq 1 "$attempts"); do
              "$@" && return 0
              if [ "$attempt" -lt "$attempts" ]; then
                echo "Attempt $attempt/$attempts failed, retrying in ${delay}s"
                sleep "$delay"
                delay=$(( delay * 2 < 30 ? delay * 2 : 30 ))
              fi
            done
            return 1
          }

          serves_release() {
            local response
            response=$(curl -fsS --max-time 60 "https://$FQDN/version") || return 1
            echo "$response"
            grep -qF "\"version\":\"$VERSION\"" <<< "$response"
          }

          refuses_anonymous() {
            local status
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "https://$FQDN/data?limit=1")
            [ "$status" = 401 ] || { echo "/data answered $status without a token; it must be 401"; return 1; }
          }

          has_data() {
            curl -fsS --max-time 60 -H "Authorization: Bearer $API_TOKEN" "https://$FQDN/data?$1&limit=1&columns=mean" \
              | grep -q '"total":[1-9]'
          }

          # The deploy step returns before the new revision takes traffic, and the
          # old one answers until then. About 5 minutes of retries covers that.
          retry 12 serves_release \
            || { echo "::error::$FQDN never reported version $VERSION"; exit 1; }

          # A few retries more on each check, in case the old revision still
          # takes the odd request while it drains.
          retry 3 refuses_anonymous \
            || { echo "::error::/data must refuse requests without a token"; exit 1; }
          retry 3 has_data "country=MWI" \
            || { echo "::error::no MWI data served"; exit 1; }
          for source in naomi spectrum shipp; do
            retry 3 has_data "country=TZA&source=$source" \
              || { echo "::error::no TZA $source data served"; exit 1; }
          done
